name: Publish to PyPI

on:
    push:
        tags:
            - "v*.*.*" # Triggers on version tags like v0.1.0, v1.2.3, v0.1.0-test, etc.

jobs:
    test:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                python-version: ["3.10", "3.11", "3.12"]
                django-version: ["3.2", "4.2", "5.0"]

        steps:
            - uses: actions/checkout@v3

            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v4
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install "Django~=${{ matrix.django-version }}.0"
                  pip install -e ".[dev]"

            - name: Run tests
              run: |
                  pytest --cov=django_role_based_masking --cov-report=xml

    lint:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v3

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                  python-version: "3.11"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install ruff

            - name: Run ruff
              run: |
                  ruff check .
                  ruff format --check .

    build-and-publish:
        runs-on: ubuntu-latest
        needs: [test, lint]
        permissions:
            id-token: write # IMPORTANT: this permission is mandatory for trusted publishing
            contents: read

        steps:
            - uses: actions/checkout@v3

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                  python-version: "3.11"

            - name: Install build dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install build twine

            - name: Build package
              run: python -m build

            - name: Check package
              run: twine check dist/*

            - name: Determine target repository
              id: repo
              run: |
                  TAG_NAME=${GITHUB_REF#refs/tags/}
                  if [[ "$TAG_NAME" == *"test"* ]]; then
                    echo "repository=testpypi" >> $GITHUB_OUTPUT
                    echo "url=https://test.pypi.org/legacy/" >> $GITHUB_OUTPUT
                    echo "Publishing to TestPyPI (tag contains 'test'): $TAG_NAME"
                  else
                    echo "repository=pypi" >> $GITHUB_OUTPUT
                    echo "url=https://upload.pypi.org/legacy/" >> $GITHUB_OUTPUT
                    echo "Publishing to PyPI (production): $TAG_NAME"
                  fi

            - name: Publish to TestPyPI
              if: contains(github.ref, 'test')
              uses: pypa/gh-action-pypi-publish@release/v1
              with:
                  password: ${{ secrets.PYPI_API_TOKEN }}
                  repository-url: https://test.pypi.org/legacy/

            - name: Publish to PyPI
              if: "!contains(github.ref, 'test')"
              uses: pypa/gh-action-pypi-publish@release/v1
              with:
                  password: ${{ secrets.PYPI_API_TOKEN }}
